<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitEasy - Split Options</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <div class="brand">
          <span class="brand-logo">⚡</span>
          <h2>SplitEasy</h2>
        </div>
        <button class="hamburger-btn" aria-label="Menu" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer; display: none;">☰</button>
      </div>
      <nav class="nav-menu">
        <a href="../index.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="group-details.html" class="nav-item active"><span class="icon">👥</span> My Groups</a>
        <a href="expense-history.html" class="nav-item"><span class="icon">🕒</span> Activity & History</a>
        <a href="balances.html" class="nav-item"><span class="icon">⚖️</span> Balances & Settle</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="modal-card large">
        <div class="modal-header">
          <h2>Choose How to Split: ₹4,850</h2>
          <a href="add-expense.html" class="close-x">&times;</a>
        </div>

        <div class="split-nav">
          <a href="split-options.html" class="split-tab-btn" style="text-decoration: none; text-align: center; line-height: normal; display: flex; align-items: center; justify-content: center;">Split Equally</a>
          <a href="split-exact.html" class="split-tab-btn" style="text-decoration: none; text-align: center; line-height: normal; display: flex; align-items: center; justify-content: center;">Exact Amounts</a>
          <a href="split-percentage.html" class="split-tab-btn active" style="text-decoration: none; text-align: center; line-height: normal; display: flex; align-items: center; justify-content: center;">By Percentage</a>
        </div>

        <div class="split-live-preview">
          <div class="split-participant">
            <input type="checkbox" checked />
            <div class="avatar sm">A</div>
            <span>Aarav (You)</span>
            <div style="display: flex; align-items: center;"><input type="number" value="25" style="width: 60px; padding: 4px; border-radius: 4px; border: 1px solid #ccc; background: #2a2e4a; color: white;" /><span style="margin-left: 4px;">%</span></div>
          </div>
          <div class="split-participant">
            <input type="checkbox" checked />
            <div class="avatar sm">AG</div>
            <span>Aman Gupta</span>
            <div style="display: flex; align-items: center;"><input type="number" value="25" style="width: 60px; padding: 4px; border-radius: 4px; border: 1px solid #ccc; background: #2a2e4a; color: white;" /><span style="margin-left: 4px;">%</span></div>
          </div>
          <div class="split-participant">
            <input type="checkbox" checked />
            <div class="avatar sm">MS</div>
            <span>Manav Shah</span>
            <div style="display: flex; align-items: center;"><input type="number" value="25" style="width: 60px; padding: 4px; border-radius: 4px; border: 1px solid #ccc; background: #2a2e4a; color: white;" /><span style="margin-left: 4px;">%</span></div>
          </div>
          <div class="split-participant">
            <input type="checkbox" checked />
            <div class="avatar sm">RR</div>
            <span>Rohan Roy</span>
            <div style="display: flex; align-items: center;"><input type="number" value="25" style="width: 60px; padding: 4px; border-radius: 4px; border: 1px solid #ccc; background: #2a2e4a; color: white;" /><span style="margin-left: 4px;">%</span></div>
          </div>
        </div>

        <div class="modal-actions">
          <a href="add-expense.html" class="btn btn-outline">Back</a>
          <a href="group-details.html" class="btn btn-purple">Save & Split Expense</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const hamburger = document.querySelector('.hamburger-btn');
      const navMenu = document.querySelector('.nav-menu');
      if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
          navMenu.classList.toggle('show-mobile');
        });
      }
    });
  </script>
</body>
</html>
