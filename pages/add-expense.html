<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitEasy - Add Expense</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <div class="brand">
          <span class="brand-logo">⚡</span>
          <h2>SplitEasy</h2>
        </div>
        <button class="hamburger-btn" aria-label="Menu" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer; display: none;">☰</button>
      </div>
      <nav class="nav-menu">
        <a href="../index.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="group-details.html" class="nav-item active"><span class="icon">👥</span> My Groups</a>
        <a href="expense-history.html" class="nav-item"><span class="icon">🕒</span> Activity & History</a>
        <a href="balances.html" class="nav-item"><span class="icon">⚖️</span> Balances & Settle</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Add an Expense</h2>
          <a href="group-details.html" class="close-x">&times;</a>
        </div>
        <form class="form-body">
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" class="amount-input" value="4850" placeholder="0.00" />
          </div>

          <div class="form-group">
            <label>Expense Title</label>
            <input type="text" value="Dinner at Thalassa" placeholder="What was this for?" />
          </div>

          <div class="grid-2-col">
            <div class="form-group">
              <label>Category</label>
              <select>
                <option selected>🍽️ Food & Drinks</option>
                <option>🚗 Transportation</option>
                <option>🏨 Accommodation</option>
                <option>🎟️ Entertainment</option>
              </select>
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" value="2026-10-06" />
            </div>
          </div>

          <div class="form-group">
            <label>Paid by</label>
            <select>
              <option selected>Aarav (You)</option>
              <option>Aman Gupta</option>
              <option>Manav Shah</option>
              <option>Rohan Roy</option>
            </select>
          </div>

          <div class="modal-actions">
            <a href="group-details.html" class="btn btn-outline">Back</a>
            <a href="split-options.html" class="btn btn-purple">Next: Choose Split</a>
          </div>
        </form>
      </div>
    
      <footer class="app-footer">
        <div class="footer-links">
          <span>SplitEasy &copy; 2026</span>
          <a href="#">About</a>
          <a href="#">Terms</a>
          <a href="#">Privacy</a>
        </div>
      </footer>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const hamburger = document.querySelector('.hamburger-btn');
      const navMenu = document.querySelector('.nav-menu');
      if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
          navMenu.classList.toggle('show-mobile');
        });
      }
    });
  </script>
</body>
</html>
