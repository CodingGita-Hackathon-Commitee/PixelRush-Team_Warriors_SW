<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitEasy - Create Group</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <div class="brand">
          <span class="brand-logo">⚡</span>
          <h2>SplitEasy</h2>
        </div>
        <button class="hamburger-btn" aria-label="Menu" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer; display: none;">☰</button>
      </div>
      <nav class="nav-menu">
        <a href="../index.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
        <a href="group-details.html" class="nav-item active"><span class="icon">👥</span> My Groups</a>
        <a href="expense-history.html" class="nav-item"><span class="icon">🕒</span> Activity & History</a>
        <a href="balances.html" class="nav-item"><span class="icon">⚖️</span> Balances & Settle</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Create a New Group</h2>
          <a href="../index.html" class="close-x">&times;</a>
        </div>
        <form class="form-body">
          <div class="form-group">
            <label>Group Name</label>
            <input type="text" placeholder="e.g. Manali Roadtrip, Apartment 402" value="Goa Trip" />
          </div>
          
          <div class="form-group">
            <label>Category Icon</label>
            <div class="category-chips">
              <span class="chip active">🏖️️ Trip</span>
              <span class="chip">🏠 Home</span>
              <span class="chip">🍽️ Dining</span>
              <span class="chip">🎉 Event</span>
            </div>
          </div>

          <div class="form-group">
            <label>Base Currency</label>
            <select class="form-select" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #333; background: #1a1e36; color: #fff; margin-top: 0.5rem; font-family: 'Plus Jakarta Sans', sans-serif;">
              <option value="INR">₹ INR</option>
              <option value="USD">$ USD</option>
            </select>
          </div>

          <div class="form-group">
            <label>Add Members (Email or Mobile)</label>
            <input type="text" placeholder="Type member name or phone..." />
            <div class="chips-container">
              <span class="chip-item">Aarav (You)</span>
              <span class="chip-item">Aman &times;</span>
              <span class="chip-item">Manav &times;</span>
              <span class="chip-item">Rohan &times;</span>
            </div>
          </div>

          <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; padding: 1rem; background: #1a1e36; border-radius: 8px;">
            <label style="margin: 0; font-weight: 500;">Allow all members to record expenses</label>
            <label class="switch" style="position: relative; display: inline-block; width: 40px; height: 24px;">
              <input type="checkbox" checked style="opacity: 0; width: 0; height: 0;">
              <span class="slider round" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #7b5eea; border-radius: 24px;"></span>
            </label>
          </div>


          <div class="modal-actions">
            <a href="../index.html" class="btn btn-outline">Cancel</a>
            <a href="group-details.html" class="btn btn-purple">Create Group</a>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script>
    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.chip.active')?.classList.remove('active');
        btn.classList.add('active');
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const hamburger = document.querySelector('.hamburger-btn');
      const navMenu = document.querySelector('.nav-menu');
      if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
          navMenu.classList.toggle('show-mobile');
        });
      }
    });
  </script>
</body>
</html>
